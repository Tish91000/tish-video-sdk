[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tish-video-sdk"
version = "0.1.0"
description = "A Python SDK for generating videos with narration, subtitles, music, and imagery"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Cyril PETER"}]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "google-cloud-texttospeech",
    "google-genai",
    "langchain",
    "langchain-core",
    "langchain-google-genai",
    "moviepy>=1.0.3",
    "numpy>=1.20.0",
    "Pillow>=8.0.0",
    "pydub",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=21.0",
    "flake8>=3.8",
    "mypy>=0.910",
]

[project.urls]
Homepage = "https://github.com/Tish91000/tish-video-sdk"
Repository = "https://github.com/Tish91000/tish-video-sdk"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: makes real network/API calls and needs real credentials; skips itself when those aren't available. Exclude with `pytest -m \"not integration\"`.",
]
